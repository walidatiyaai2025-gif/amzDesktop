name: Build RemoteScreen V2.2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'remotescreen-v22/**'
      - '.github/workflows/remotescreen-v22.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows EXE
        shell: pwsh
        run: |
          dotnet restore remotescreen-v22/windows/RemoteScreenDesktopV22.csproj
          dotnet publish remotescreen-v22/windows/RemoteScreenDesktopV22.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          Copy-Item remotescreen-v22/windows/bin/Release/net8.0-windows/win-x64/publish/RemoteScreenDesktopV22.exe RemoteScreenDesktopV22.exe

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteScreenDesktopV22-EXE
          path: RemoteScreenDesktopV22.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        shell: bash
        run: |
          rm -rf /tmp/remote_screen_mobile_v22
          flutter create --platforms=android --org com.walid.remotescreen --project-name remote_screen_mobile_v22 /tmp/remote_screen_mobile_v22
          cp remotescreen-v22/mobile/pubspec.yaml /tmp/remote_screen_mobile_v22/pubspec.yaml
          cp remotescreen-v22/mobile/lib/main.dart /tmp/remote_screen_mobile_v22/lib/main.dart
          cp remotescreen-v22/mobile/android/MainActivity.kt /tmp/remote_screen_mobile_v22/android/app/src/main/kotlin/com/walid/remotescreen/remote_screen_mobile_v22/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/remote_screen_mobile_v22/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('>', '>\n    <uses-permission android:name="android.permission.INTERNET"/>', 1)
          s=s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY

      - name: Build release APK
        shell: bash
        run: |
          cd /tmp/remote_screen_mobile_v22
          rm -rf test
          rm -f analysis_options.yaml
          flutter pub get
          flutter analyze lib/main.dart
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/RemoteScreenMobileV22.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteScreenMobileV22-APK
          path: RemoteScreenMobileV22.apk
          if-no-files-found: error
